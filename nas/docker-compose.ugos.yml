# Sideloop on a NAS with a Docker GUI (written for UGREEN UGOS Pro, x86_64).
#
# Paste this whole file into  Docker > Project > Create > "Create docker-compose.yml".
# It builds the image straight from GitHub, so nothing has to be uploaded to the NAS first.
#
# Before you create the project, check three things:
#   1. Data folder: /volume1/docker/sideloop-app/data  ("volume1" and the shared folder "docker"
#      must exist on your NAS; change the three paths below if yours are different).
#   2. TZ: set your time zone.
#   3. ANISETTE_SERVER: a comma separated list of public servers; the next one is tried when a server fails.
#      Leave the default unless the guide's troubleshooting page tells you otherwise.
#
# Raspberry Pi / ARM NAS: replace "amd64" with "aarch64" in the builder image and
# "x86_64" with "aarch64" in the netmuxd URL and the plumesign URL. For Apple TV support on ARM, also replace the
# plumesign checksum with baa4fe218aced4021f51470c00ac95c8e4ebfd2bdfa13f22c2a8ffa310288f59.
name: sideloop

services:
  app:
    build:
      context: .
      dockerfile_inline: |
        # --- 1. get this repository (for the patches, scripts and the web app) ---------------
        # Pinned to a commit so the build is reproducible. To update, put a newer commit SHA
        # of https://github.com/ErikSeiter/sideloop-nas in the checkout below.
        FROM alpine:3.20 AS repo
        RUN apk add --no-cache git \
         && git clone -q https://github.com/ErikSeiter/sideloop-nas.git /repo \
         && cd /repo && git checkout -q 4ce1c9579d8503ecc669803ed29193f24e3d78e5

        # --- 2. build AltServer from the tag that can sign in after Apple's Oct 2026 change --
        FROM ghcr.io/nyamisty/altserver_builder_alpine_amd64 AS altserver
        COPY --from=repo /repo/altserver/ /tmp/patches/
        RUN git clone -q --recursive --depth 1 --shallow-submodules -b ng-2026-11-05 \
              https://github.com/jaakkopalvaila/AltServer-Linux /src \
         && cd /src && git apply /tmp/patches/*.patch \
         && mkdir build && cd build && make -f ../Makefile -j4 \
         && cp AltServer-* /AltServer

        # --- 3. the runtime image -----------------------------------------------------------
        FROM debian:trixie-slim
        RUN apt-get update \
         && apt-get install -y --no-install-recommends \
              libimobiledevice-utils usbmuxd openssl python3 curl ca-certificates coreutils tzdata \
         && rm -rf /var/lib/apt/lists/*
        RUN curl -fsSL https://github.com/jkcoxson/netmuxd/releases/download/v0.4.3/netmuxd-x86_64-unknown-linux-gnu.tar.gz \
              | tar xz -C /usr/local/bin \
         && chmod +x /usr/local/bin/netmuxd
        # plumesign (MIT) is what installs apps on an Apple TV. Pinned and checked against its SHA-256; if either
        # fails the image is still built, without Apple TV support (iPhones and iPads are not affected).
        RUN if curl -fsSL -o /tmp/plumesign.tgz https://github.com/bitxeno/PlumeImpactor/releases/download/v2.7.1-patch.11/plumesign-linux-x86_64.tar.gz \
               && echo "91c82918449f4810bff96bc43be746b86db3f5236b505102d2ed7daa0f78f5b8  /tmp/plumesign.tgz" | sha256sum -c - \
               && tar xzf /tmp/plumesign.tgz -C /tmp \
               && install -m 0755 /tmp/plumesign-linux-x86_64 /usr/local/bin/plumesign; \
            then echo "plumesign installed"; \
            else echo "WARNING: plumesign could not be installed, Apple TV support is off"; fi; \
            rm -f /tmp/plumesign.tgz /tmp/plumesign-linux-x86_64
        COPY --from=altserver /AltServer /usr/local/bin/AltServer
        COPY --from=repo /repo/scripts/ /usr/local/bin/
        COPY --from=repo /repo/sideloop/ /opt/sideloop/
        ENV DATA_DIR=/data PYTHONPATH=/opt PYTHONUNBUFFERED=1
        WORKDIR /data
        EXPOSE 8080
    image: sideloop
    pull_policy: build
    container_name: sideloop
    command: ["python3", "-m", "sideloop"]
    restart: unless-stopped
    network_mode: host        # the web UI is then on http://<nas-ip>:8080
    privileged: true          # needed to see the iPhone on the NAS's USB port
    environment:
      MUX: builtin
      ANISETTE_SERVER: https://new.ani.sidestore.io,https://mac-ani.jkcoxson.com,https://ani3.stikstore.app
      XDG_CONFIG_HOME: /data/xdg   # keeps the anisette identity in the data folder
      TZ: Europe/Zurich
    volumes:
      - /volume1/docker/sideloop-app/data:/data
      - /volume1/docker/sideloop-app/data/lockdown:/var/lib/lockdown
      - /run/udev:/run/udev:ro
      - /dev/bus/usb:/dev/bus/usb
